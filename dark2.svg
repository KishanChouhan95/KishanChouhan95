<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <!-- Background Radial Gradients -->
    <radialGradient id="bgGlow1" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.25">
        <animate attributeName="stop-color" values="#7C3AED;#22D3EE;#10B981;#7C3AED" dur="18s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow2" cx="80%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.2">
        <animate attributeName="stop-color" values="#22D3EE;#10B981;#7C3AED;#22D3EE" dur="22s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#10B981"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 0.5 0.5" to="360 0.5 0.5" dur="12s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Glass Reflection & Shimmer Gradient -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="2 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <clipPath id="cardClip">
      <rect width="1180" height="610" rx="24"/>
    </clipPath>
    
    <!-- Profile Photo Clip Path -->
    <clipPath id="avatarClip">
      <rect width="360" height="400" rx="14"/>
    </clipPath>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Roboto Mono', monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
    .cursor { animation: blink 0.8s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .pill { transition: transform 0.3s ease; transform-origin: center; }
    .pill:hover { transform: scale(1.08); filter: drop-shadow(0 0 8px rgba(34, 211, 238, 0.6)); }
    .particle { animation: floatParticle linear infinite; }
    @keyframes floatParticle {
      0% { transform: translateY(0) translateX(0); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-100px) translateX(20px); opacity: 0; }
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1180" height="610" rx="24" fill="#030712"/>
  <rect width="1180" height="610" rx="24" fill="url(#bgGlow1)"/>
  <rect width="1180" height="610" rx="24" fill="url(#bgGlow2)"/>

  <!-- Ambient Particles -->
  <g opacity="0.6">
    <circle cx="150" cy="500" r="1.5" fill="#22D3EE" class="particle" style="animation-duration: 7s;"/>
    <circle cx="320" cy="420" r="1" fill="#7C3AED" class="particle" style="animation-duration: 9s; animation-delay: 1s;"/>
    <circle cx="750" cy="550" r="1.5" fill="#10B981" class="particle" style="animation-duration: 8s; animation-delay: 2s;"/>
    <circle cx="1020" cy="380" r="1" fill="#22D3EE" class="particle" style="animation-duration: 10s; animation-delay: 0.5s;"/>
  </g>

  <!-- Outer Glass Border -->
  <rect width="1178" height="608" x="1" y="1" rx="23" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>
  <rect width="1180" height="610" rx="24" fill="url(#shimmer)" clip-path="url(#cardClip)"/>

  <!-- ================= LEFT PANEL: REAL PHOTO OPTION ================= -->
  <g transform="translate(32, 32)">
    <rect width="420" height="546" rx="16" fill="#0F172A" fill-opacity="0.65" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    
    <!-- User Photo Frame -->
    <g transform="translate(30, 45)">
      <image href="./picture.png" x="0" y="0" width="360" height="400" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatarClip)"/>
      <rect width="360" height="400" rx="14" fill="none" stroke="rgba(34, 211, 238, 0.4)" stroke-width="1.5" filter="url(#softGlow)"/>
    </g>

    <!-- Scanline Line Animation -->
    <g clip-path="url(#avatarClip)" transform="translate(30, 45)">
      <line x1="0" y1="0" x2="360" y2="0" stroke="rgba(34, 211, 238, 0.4)" stroke-width="2" filter="url(#softGlow)">
        <animate attributeName="y1" values="0;400;0" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="0;400;0" dur="5s" repeatCount="indefinite"/>
      </line>
    </g>

    <g transform="translate(30, 485)">
      <text font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">
        <tspan fill="#10B981">●</tspan> USER_AUTHENTICATED <tspan fill="#64748B">|</tspan> v2.4
      </text>
    </g>
  </g>

  <!-- ================= RIGHT PANEL: TERMINAL ================= -->
  <g transform="translate(476, 32)">
    <rect width="672" height="546" rx="16" fill="#0F172A" fill-opacity="0.75" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

    <g transform="translate(24, 20)">
      <circle cx="0" cy="0" r="6" fill="#EF4444"/>
      <circle cx="18" cy="0" r="6" fill="#F59E0B"/>
      <circle cx="36" cy="0" r="6" fill="#10B981"/>
      <text x="70" y="4" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748B">bash - kishanchouhan@profile:~</text>
    </g>

    <line x1="0" y1="44" x2="672" y2="44" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>

    <g transform="translate(32, 72)">
      <text class="font-mono" font-size="14" fill="#22D3EE">
        <tspan fill="#7C3AED">❯</tspan> hello_world.sh
      </text>
      
      <text class="font-sans" font-size="32" font-weight="800" fill="#F8FAFC" x="0" y="42">
        Hi, I'm <tspan fill="url(#accentGrad)">Kishan Chouhan</tspan>
      </text>

      <g transform="translate(0, 76)">
        <text class="font-mono" font-size="18" font-weight="600" fill="#94A3B8">
          <tspan fill="#10B981">&gt;</tspan> 
          <tspan fill="#F8FAFC">
            <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.22;0.25;1" dur="12s" repeatCount="indefinite"/>
            Full-Stack Developer
          </tspan>
          <tspan fill="#F8FAFC" x="20">
            <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.28;0.47;0.50;1" dur="12s" repeatCount="indefinite"/>
            React &amp; Frontend
          </tspan>
          <tspan fill="#F8FAFC" x="20">
            <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.50;0.53;0.72;0.75;1" dur="12s" repeatCount="indefinite"/>
            MERN Stack
          </tspan>
          <tspan fill="#F8FAFC" x="20">
            <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.75;0.78;1" dur="12s" repeatCount="indefinite"/>
            Backend
          </tspan>
        </text>
        <rect x="260" y="-14" width="9" height="20" fill="#22D3EE" class="cursor"/>
      </g>

      <g transform="translate(0, 125)" font-family="'JetBrains Mono', monospace" font-size="13">
        <g opacity="0"><animate attributeName="opacity" to="1" begin="0.6s" fill="freeze" dur="0.4s"/><text fill="#64748B" y="0">📍 Location :</text><text fill="#CBD5E1" x="120" y="0">Ujjain,M.P,India</text></g>
        <g opacity="0" transform="translate(0, 26)"><animate attributeName="opacity" to="1" begin="0.8s" fill="freeze" dur="0.4s"/><text fill="#64748B" y="0">🎓 Role     :</text><text fill="#CBD5E1" x="120" y="0">Full-Stack Developer</text></g>
        <g opacity="0" transform="translate(0, 52)"><animate attributeName="opacity" to="1" begin="1.0s" fill="freeze" dur="0.4s"/><text fill="#64748B" y="0">⚡ Focus    :</text><text fill="#CBD5E1" x="120" y="0">React, Node.js, Spring Boot &amp; Databases</text></g>
        <g opacity="0" transform="translate(0, 78)"><animate attributeName="opacity" to="1" begin="1.2s" fill="freeze" dur="0.4s"/><text fill="#64748B" y="0">🔗 Portfolio:</text><text fill="#22D3EE" x="120" y="0">https://kishan-portfolio-vc8n.onrender.com</text></g>
        <g opacity="0" transform="translate(0, 104)"><animate attributeName="opacity" to="1" begin="1.4s" fill="freeze" dur="0.4s"/><text fill="#64748B" y="0">📫 Contact  :</text><text fill="#CBD5E1" x="120" y="0">kishanchouhanc95@gmail.com</text></g>
      </g>

      <g transform="translate(0, 275)">
        <text font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1">TECHNICAL_STACK</text>
        <g transform="translate(0, 16)">
          <g class="pill" transform="translate(0, 0)"><rect width="68" height="26" rx="13" fill="#1E293B" stroke="rgba(34, 211, 238, 0.3)" stroke-width="1"/><text x="34" y="17" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#F8FAFC" text-anchor="middle">React</text></g>
          <g class="pill" transform="translate(76, 0)"><rect width="74" height="26" rx="13" fill="#1E293B" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/><text x="37" y="17" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#F8FAFC" text-anchor="middle">Node.js</text></g>
          <g class="pill" transform="translate(158, 0)"><rect width="76" height="26" rx="13" fill="#1E293B" stroke="rgba(34, 211, 238, 0.3)" stroke-width="1"/><text x="38" y="17" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#F8FAFC" text-anchor="middle">Express</text></g>
          <g class="pill" transform="translate(242, 0)"><rect width="90" height="26" rx="13" fill="#1E293B" stroke="rgba(124, 58, 237, 0.3)" stroke-width="1"/><text x="45" y="17" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#F8FAFC" text-anchor="middle">Spring Boot</text></g>
          <g class="pill" transform="translate(340, 0)"><rect width="84" height="26" rx="13" fill="#1E293B" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/><text x="42" y="17" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#F8FAFC" text-anchor="middle">MongoDB</text></g>
          <g class="pill" transform="translate(432, 0)"><rect width="68" height="26" rx="13" fill="#1E293B" stroke="rgba(34, 211, 238, 0.3)" stroke-width="1"/><text x="34" y="17" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#F8FAFC" text-anchor="middle">MySQL</text></g>
        </g>
      </g>
    </g>
  </g>
</svg>