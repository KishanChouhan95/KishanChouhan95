<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-labelledby="title desc">
  <title id="title">Kishan Chouhan — Full Stack Developer</title>
  <desc id="desc">Animated GitHub profile banner with ASCII portrait, terminal, skills and glowing effects.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030712"/>
      <stop offset=".5" stop-color="#07101F"/>
      <stop offset="1" stop-color="#030712"/>
      <animate attributeName="x1" values="0;1;0" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="12s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset=".5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#10B981"/>
      <animate attributeName="x1" values="0;1;0" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="glow1">
      <stop offset="0" stop-color="#7C3AED" stop-opacity=".20"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".16"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="card"><rect x="22" y="22" width="1136" height="566" rx="30"/></clipPath>
    <clipPath id="term"><rect x="478" y="92" width="634" height="432" rx="22"/></clipPath>

    <pattern id="noise" width="90" height="90" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="14" r=".7" fill="#FFFFFF" opacity=".06"/>
      <circle cx="44" cy="67" r=".55" fill="#FFFFFF" opacity=".05"/>
      <circle cx="75" cy="31" r=".5" fill="#FFFFFF" opacity=".05"/>
    </pattern>
  </defs>

  <rect width="1180" height="610" fill="#030712"/>

  <g clip-path="url(#card)">
    <rect x="22" y="22" width="1136" height="566" rx="30" fill="url(#bg)" filter="url(#shadow)"/>

    <circle cx="150" cy="110" r="260" fill="url(#glow1)">
      <animate attributeName="cx" values="150;210;150" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="110;160;110" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1030" cy="430" r="300" fill="url(#glow2)">
      <animate attributeName="cx" values="1030;970;1030" dur="11s" repeatCount="indefinite"/>
    </circle>

    <rect x="22" y="22" width="1136" height="566" fill="url(#noise)"/>

    <!-- floating particles -->
    <g fill="#22D3EE" filter="url(#glow)">
      <circle cx="92" cy="90" r="2"><animateMotion dur="8s" repeatCount="indefinite" path="M0 0 C40 40 15 120 70 160"/></circle>
      <circle cx="410" cy="520" r="1.5"><animateMotion dur="10s" repeatCount="indefinite" path="M0 0 C-50 -70 60 -110 10 -190"/></circle>
      <circle cx="1090" cy="115" r="1.6"><animateMotion dur="9s" repeatCount="indefinite" path="M0 0 C-60 50 -30 120 -90 170"/></circle>
    </g>

    <!-- border shimmer -->
    <rect x="22" y="22" width="1136" height="566" rx="30" fill="none" stroke="#FFFFFF" stroke-width="1"/>
    <rect x="23" y="23" width="1134" height="564" rx="29" fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-dasharray="80 1800" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" from="0" to="-1880" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- LEFT ASCII -->
    <g transform="translate(62 72)">
      <text x="0" y="0" fill="#64748B" font-family="monospace" font-size="12" letter-spacing="3">PROFILE.SVG / SYSTEM</text>
      <line x1="0" y1="18" x2="360" y2="18" stroke="#FFFFFF"/>

      <g font-family="monospace" font-size="15" font-weight="700" fill="url(#accent)" filter="url(#glow)"
         transform="translate(8 54)">
        <text x="0" y="0">          .-''''-.</text>
        <text x="0" y="19">        .'  .--.  '.</text>
        <text x="0" y="38">       /   /    \   \</text>
        <text x="0" y="57">      ;   |  O  |   ;</text>
        <text x="0" y="76">      |   |  -- |   |</text>
        <text x="0" y="95">      ;   \____/   ;</text>
        <text x="0" y="114">       \   '----'  /</text>
        <text x="0" y="133">        '.        .'</text>
        <text x="0" y="152">          '-.__.-'</text>
        <text x="0" y="171">        __/|    |\__</text>
        <text x="0" y="190">      .'   |    |   '.</text>
        <text x="0" y="209">     /_____|____|_____\\</text>
        <text x="0" y="228">          /    \</text>
        <text x="0" y="247">         /______\</text>
        <animateTransform attributeName="transform" type="translate" values="8 54;8 50;8 54" dur="5s" repeatCount="indefinite"/>
      </g>

      <!-- scanline sweep -->
      <rect x="0" y="64" width="360" height="2" fill="#22D3EE" opacity=".18">
        <animate attributeName="y" values="64;330;64" dur="4.5s" repeatCount="indefinite"/>
      </rect>

      <!-- line by line reveal -->
      <g font-family="monospace">
        <text x="4" y="356" fill="#64748B" font-size="12"><tspan fill="#22D3EE">$</tspan> whoami</text>
        <text x="4" y="381" fill="url(#accent)" font-size="18" font-weight="700">KISHAN CHOUHAN</text>
        <text x="4" y="406" fill="#64748B" font-size="12">FULL STACK DEVELOPER</text>
        <text x="4" y="438" fill="#64748B" font-size="11"><tspan fill="#10B981">●</tspan> building useful things</text>
        <text x="4" y="459" fill="#64748B" font-size="11"><tspan fill="#22D3EE">●</tspan> learning every day</text>
      </g>
    </g>

    <line x1="452" y1="72" x2="452" y2="538" stroke="#FFFFFF"/>
    <line x1="453" y1="120" x2="453" y2="210" stroke="url(#accent)" stroke-width="2" filter="url(#glow)"/>

    <!-- TERMINAL -->
    <g filter="url(#shadow)">
      <rect x="478" y="92" width="634" height="432" rx="22" fill="#0F172A" stroke="#FFFFFF"/>
      <rect x="478" y="92" width="634" height="52" rx="22" fill="#0F172A2"/>
      <rect x="478" y="122" width="634" height="22" fill="#0F172A2"/>
      <circle cx="508" cy="118" r="5" fill="#FB7185" opacity=".85"/>
      <circle cx="526" cy="118" r="5" fill="#FBBF24" opacity=".85"/>
      <circle cx="544" cy="118" r="5" fill="#34D399" opacity=".85"/>
      <text x="566" y="122" fill="#64748B" font-family="monospace" font-size="11">kishan@github: ~/profile</text>

      <g clip-path="url(#term)" font-family="monospace">
        <text x="510" y="176" fill="#22D3EE" font-size="12">$</text>
        <text x="530" y="176" fill="#F8FAFC" font-size="12">./introduce.sh</text>

        <text x="510" y="211" fill="#F8FAFC" font-size="25" font-weight="700">Hi 👋</text>
        <text x="510" y="241" fill="#94A3B8" font-size="13">I'm</text>
        <text x="550" y="241" fill="url(#accent)" font-size="17" font-weight="700">Kishan Chouhan</text>

        <rect x="721" y="227" width="2" height="19" fill="#22D3EE" filter="url(#glow)">
          <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
        </rect>

        <text x="510" y="276" fill="#64748B" font-size="11">ROLE</text>
        <text x="510" y="298" fill="#F8FAFC" font-size="14">Full Stack Developer</text>

        <text x="510" y="334" fill="#64748B" font-size="11">FOCUS</text>
        <text x="510" y="356" fill="#F8FAFC" font-size="13">React.js · Node.js · Spring Boot · REST APIs</text>

        <text x="510" y="392" fill="#64748B" font-size="11">STACK</text>

        <g font-size="11">
          <g transform="translate(510 406)">
            <rect width="74" height="28" rx="14" fill="#7C3AED" fill-opacity=".10" stroke="#7C3AED" stroke-opacity=".35"/>
            <text x="14" y="18" fill="#7C3AED">React.js</text>
          </g>
          <g transform="translate(594 406)">
            <rect width="80" height="28" rx="14" fill="#22D3EE" fill-opacity=".10" stroke="#22D3EE" stroke-opacity=".35"/>
            <text x="14" y="18" fill="#22D3EE">Node.js</text>
          </g>
          <g transform="translate(684 406)">
            <rect width="91" height="28" rx="14" fill="#10B981" fill-opacity=".10" stroke="#10B981" stroke-opacity=".35"/>
            <text x="13" y="18" fill="#10B981">Spring Boot</text>
          </g>
          <g transform="translate(785 406)">
            <rect width="68" height="28" rx="14" fill="#22D3EE" fill-opacity=".10" stroke="#22D3EE" stroke-opacity=".35"/>
            <text x="14" y="18" fill="#22D3EE">MongoDB</text>
          </g>
        </g>

        <text x="510" y="470" fill="#22D3EE" font-size="12">$</text>
        <text x="530" y="470" fill="#94A3B8" font-size="12">status: online</text>
        <circle cx="650" cy="466" r="4" fill="#10B981" filter="url(#glow)">
          <animate attributeName="opacity" values=".25;1;.25" dur="1.8s" repeatCount="indefinite"/>
        </circle>
        <rect x="667" y="456" width="2" height="17" fill="#22D3EE">
          <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- social/status -->
    <g transform="translate(478 550)" font-family="monospace" font-size="10">
      <text x="0" y="0" fill="#64748B">GITHUB</text>
      <text x="75" y="0" fill="#64748B">LINKEDIN</text>
      <text x="160" y="0" fill="#64748B">PORTFOLIO</text>
      <text x="265" y="0" fill="#64748B">EMAIL</text>
      <line x1="0" y1="9" x2="350" y2="9" stroke="url(#accent)" stroke-opacity=".35"/>
    </g>
  </g>
</svg>
